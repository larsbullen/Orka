<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Orka">
<title>Orka</title>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#f4f4f2; --surface-2:#eaeae7; --line:#e2e2df; --grid:#e6e6e3;
  --text:#111111; --text-2:#5c5c59; --text-3:#6b6b67;
  --accent:#ff5b1f; --accent-text:#c2410c; --accent-soft:#ffe6da;
  --series-1:#ff5b1f; --series-2:#1f1f1d; --series-3:#5c5c59; --series-4:#8f8f8b; --series-5:#b8b8b4; --ref:#8f8f8b; --sec-climb:#e4e4e0; --sec-descent:#f0f0ed; --sec-rolling:#eaeae6;
  --dv-d3:#3d3d3a; --dv-d2:#7c7c78; --dv-d1:#b9b9b5; --dv-0:#dcdcd8; --dv-u1:#ffc2a6; --dv-u2:#ff8a57; --dv-u3:#d4440c;
  --band:#e2e2de; --band-edge:#b5b5b0;
  --ph-1:#d4d4d0; --ph-2:#b0b0ab; --ph-3:#8a8a85; --ph-4:#5f5f5b; --ph-5:#2f2f2d;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#111111;
  --today:#ffffff; --today-edge:transparent;
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0c0c; --surface:#171717; --surface-2:#222221; --line:#2c2c2b; --grid:#262625;
    --text:#f5f5f4; --text-2:#a8a8a4; --text-3:#9a9a96;
    --accent:#ff6a2b; --accent-text:#ff8a57; --accent-soft:#3a2016;
    --series-1:#ff6a2b; --series-2:#f0f0ee; --series-3:#b5b5b1; --series-4:#7d7d79; --series-5:#55554f; --ref:#8a8a86; --sec-climb:#262625; --sec-descent:#1b1b1b; --sec-rolling:#202020;
    --dv-d3:#d6d6d2; --dv-d2:#9a9a96; --dv-d1:#5e5e5b; --dv-0:#3a3a38; --dv-u1:#7a3417; --dv-u2:#d9531c; --dv-u3:#ff8a57;
    --band:#2e2e2d; --band-edge:#5a5a57;
    --ph-1:#3a3a38; --ph-2:#555553; --ph-3:#777774; --ph-4:#9b9b97; --ph-5:#cfcfcb;
    --good-text:#f5f5f4;
    --today:#2e2e2d; --today-edge:transparent;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0c0c0c; --surface:#171717; --surface-2:#222221; --line:#2c2c2b; --grid:#262625;
    --text:#f5f5f4; --text-2:#a8a8a4; --text-3:#9a9a96;
    --accent:#ff6a2b; --accent-text:#ff8a57; --accent-soft:#3a2016;
    --series-1:#ff6a2b; --series-2:#f0f0ee; --series-3:#b5b5b1; --series-4:#7d7d79; --series-5:#55554f; --ref:#8a8a86; --sec-climb:#262625; --sec-descent:#1b1b1b; --sec-rolling:#202020;
    --dv-d3:#d6d6d2; --dv-d2:#9a9a96; --dv-d1:#5e5e5b; --dv-0:#3a3a38; --dv-u1:#7a3417; --dv-u2:#d9531c; --dv-u3:#ff8a57;
    --band:#2e2e2d; --band-edge:#5a5a57;
    --ph-1:#3a3a38; --ph-2:#555553; --ph-3:#777774; --ph-4:#9b9b97; --ph-5:#cfcfcb;
    --good-text:#f5f5f4;
    --today:#2e2e2d; --today-edge:transparent;
}
.exsvg{width:100%;max-width:520px;height:auto;display:block;background:var(--surface-2);border-radius:10px}
.exsvg .fig{fill:none;stroke:var(--text);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.exsvg .fig.back{stroke:var(--text-3)}
.exsvg .head{fill:var(--text)}
.exsvg .eq{fill:none;stroke:var(--text-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.exsvg .eqf{fill:var(--text-2)}
.exsvg .gnd,.exsvg .div{stroke:var(--line);stroke-width:2}
.exsvg .mv{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;stroke-linecap:round}
.exsvg .mv-h{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.exsvg .hl{fill:var(--accent);opacity:.15}
.exsvg .lbl{font:600 12px "Inter",system-ui,sans-serif;fill:var(--text-2)}
.exlink{all:unset;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px}
.exlink:hover{color:var(--accent)}
.exlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.exlink::after{content:"ⓘ";font-size:.8em;margin-left:2px;color:var(--accent);text-decoration:none;display:inline-block}
dialog#exdlg{border:1px solid var(--line);border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog#exdlg::backdrop{background:rgba(0,0,0,.45)}
#exdlg .exin{padding:16px 18px 18px}
#exdlg h3{font-size:18px;margin:0 0 4px}
#exdlg .what{color:var(--text-2);margin:0 0 12px;font-size:14px}
#exdlg ol{margin:12px 0 8px;padding-left:20px} #exdlg li{margin:3px 0}
#exdlg .avoid{font-size:14px;margin:8px 0 0;padding:8px 10px;background:var(--surface-2);border-radius:8px}
#exdlg .x{all:unset;cursor:pointer;float:right;font-size:22px;line-height:1;padding:2px 8px;border-radius:8px;color:var(--text-2)}
#exdlg .x:focus-visible{outline:2px solid var(--accent)}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.extile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.extile:hover{border-color:var(--accent)} .extile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.extile b{font-size:14px}
.exgroup{margin:14px 0 2px;font-size:13px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.csum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none}
.csum::-webkit-details-marker{display:none}
.csum h2{margin:0}
.csum .cmore{margin-left:auto;font-size:13px;font-weight:600;color:var(--text-2)}
.csum .cmore i{display:inline-block;font-style:normal;transition:transform .15s}
#coursedet[open] .csum .cmore i,.secdet[open] .csum .cmore i{transform:rotate(90deg)}
#coursedet[open] .csum,.secdet[open] > .csum{margin-bottom:12px}
.csum:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:780px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:30px;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 6px}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .race{color:var(--text-2);margin:4px 0 14px}
.count{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.count .big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.count .lbl{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--text);border-color:transparent}
.pill .dot{width:8px;height:8px;border-radius:50%}
.phasebar{position:relative;margin:18px 0 4px}
.phasebar .segs{display:flex;gap:2px;height:10px}
.phasebar .seg{border-radius:3px;height:100%}
.phasebar .labels{display:flex;gap:2px;margin-top:6px}
.phasebar .labels div{font-size:11px;color:var(--text-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.aidsw{display:inline-block;width:9px;height:9px;border:2px solid var(--text);border-radius:2px;background:var(--surface);margin-right:5px;vertical-align:-1px}
.aidrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.aid{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.day .done{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--good-text, var(--text))}
.day .none{display:block;margin-top:3px;font-size:12px;color:var(--text-3, var(--text-2));font-style:italic}
.day>summary>.chg{align-self:start;margin:1px 0 0 !important}
.day .chg{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px;color:var(--text-2);vertical-align:1px}
.panelwrap .fulltxt{margin:8px 0 4px;font-size:13px;font-weight:600}
.panelwrap > .alt{margin:0 0 4px;font-size:12px}
.phasebar .phhits{position:absolute;left:0;right:0;top:-6px;bottom:-2px;display:flex;gap:2px}
.phasebar .phhit{all:unset;cursor:pointer;border-radius:6px}
.phasebar .phhit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phasebar.hov .seg{opacity:.35;transition:opacity .12s}
.phasebar.hov .seg.on{opacity:1}
.phasebar .marker{position:absolute;top:-16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.phasebar .marker span{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap}
.phasebar .marker i{width:2px;height:20px;background:var(--text);border-radius:1px}
/* week card */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wkhead button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);font-size:20px;color:var(--text)}
.wkhead button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wkhead .t{text-align:center;flex:1}
.wkhead .t b{display:block;font-size:16px}
.wkmeta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;justify-content:center}
.days{display:flex;flex-direction:column;gap:6px}
.day{display:block;padding:0;border-radius:10px;border:1px solid transparent;background:var(--surface-2)}
details.sess{border-top:0}
.day>summary{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:9px 10px;cursor:pointer;list-style:none;border-radius:10px}
.day>summary::-webkit-details-marker,.sess>summary::-webkit-details-marker{display:none}
.day>summary:focus-visible,.sess>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.more{display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.more i{display:inline-block;font-style:normal;transition:transform .15s}
details[open]>summary .more{color:var(--text-2)}
details[open]>summary .more i{transform:rotate(90deg)}
.dpanel{padding:2px 12px 12px 72px;font-size:13px;line-height:1.45}
.dpanel ul{margin:0 0 6px;padding-left:18px}.dpanel li{margin:2px 0}
.dpanel .dl{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:5px}
.dpanel .dl b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);padding-top:2px;min-width:52px}
.dpanel .dpart{margin-bottom:8px}.dpanel .dt{font-weight:650;margin:2px 0 3px}
@media (max-width:480px){.dpanel{padding-left:12px}}
.sess .dpanel{padding:0 0 8px 46px}
@media (max-width:480px){.sess .dpanel{padding-left:4px}}
.day .d{font-weight:600;font-size:13px;line-height:1.2}
.day .d small{display:block;font-weight:400;color:var(--text-3);font-size:11px}
.day .s{font-size:14px}
.day.today{background:var(--today);border-color:var(--today-edge)}
.day.today .d::after{content:"Today";display:block;font-size:10px;font-weight:700;color:var(--text);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.day.past{opacity:.6}
.focus{margin:0 0 10px;font-size:14px}
.backnow{font-size:12px;text-align:center;margin-top:8px}
.backnow a{color:var(--accent);cursor:pointer}
/* chart */
.chartwrap{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-2);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px}
.sw.line{height:2px;border-radius:1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:10px;padding:8px 10px;font-size:12px;min-width:170px;max-width:240px;z-index:5;display:none}
.tip b{font-size:13px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .k{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--surface-2);border-radius:12px;padding:12px}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.tile .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.status svg{flex:none}
.ctrls{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.ctrls .seg3{flex:1 1 220px;margin:0}
.cmp{display:inline-flex;align-items:center;gap:6px}
.cmp select{font:inherit;font-size:13px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:190px}
.morebtn{all:unset;cursor:pointer;font-size:13px;color:var(--accent);margin-top:8px;display:inline-block}
tr.fjm td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.cchip{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;margin-left:6px;border-radius:6px;background:var(--accent-soft);color:var(--text);white-space:nowrap;vertical-align:1px}
.gbar{display:flex;gap:2px;height:12px;margin:12px 0 6px}.gbar span{border-radius:3px;min-width:2px}
.glabels{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2)}.glabels span{display:inline-flex;align-items:center;gap:5px}.glabels b{color:var(--text)}
.ctab td{font-size:13px}.ctab .small{margin-top:2px}
.secno{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--band-edge)}
.secno.k-climb{background:var(--sec-climb)}.secno.k-descent{background:var(--sec-descent)}.secno.k-rolling{background:var(--sec-rolling)}
.seg3{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:0 0 10px}
.seg3 button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:13px;padding:7px 4px;border-radius:7px;color:var(--text-2)}
.seg3 button[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg3 button:focus-visible{outline:2px solid var(--accent)}
.sw.ref{background:repeating-linear-gradient(90deg,var(--ref) 0 5px,transparent 5px 8px)}
.tbl{border:0;margin-top:6px}.tbl summary{padding:4px 0;color:var(--text-2)}.tbl table{font-size:12px}
.tile.wide{grid-column:1/-1}
.hbreak{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}.hbreak span{display:inline-flex;align-items:center;gap:4px}.hbreak .sw{width:8px;height:8px}
.alt{display:block;font-size:12px;color:var(--text-2);margin-top:2px}
.xt td:first-child{font-weight:600}
.sync{font-size:12px;color:var(--text-3);margin-top:10px}
/* checkpoints */
.cps{list-style:none;margin:0;padding:0;position:relative}
.cps li{position:relative;padding:0 0 14px 26px}
.cps li::before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.cps li:last-child::before{display:none}
.cps .dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.cps li.past .dot{background:var(--accent)}
.cps li.next .dot{box-shadow:0 0 0 4px var(--accent-soft)}
.cps .when{font-size:12px;color:var(--text-2)}
/* plan accordion */
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none;padding:10px 0}
summary::-webkit-details-marker{display:none}
summary .chev{display:inline-block;transition:transform .15s;color:var(--text-3);margin-right:6px}
details[open]>summary .chev{transform:rotate(90deg)}
.phase>summary{font-weight:650}
.wk{border-top:1px solid var(--grid);margin-left:4px}
.wk>summary{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:8px 0;font-size:14px}
.wk>summary .km{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:13px;white-space:nowrap}
.wk.cur>summary{font-weight:650}
.wk .body{padding:0 0 10px 20px}
.wk .body .sess>summary{display:grid;grid-template-columns:38px 1fr;gap:8px;font-size:13px;padding:4px 0;cursor:pointer;list-style:none}
.wk .body .sess b{color:var(--text-2);font-weight:600}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--text-2);margin-left:6px;font-weight:600;vertical-align:1px}
.tag.now{background:var(--today);color:var(--text);border:1px solid var(--today-edge)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pb td{font-weight:650}
.gymgrid{display:grid;gap:10px}
.gym{background:var(--surface-2);border-radius:12px;padding:12px;border:1px solid transparent}
.gym.cur{border-color:var(--accent)}
.gym p{margin:4px 0;font-size:13px}
.gym .ab{font-size:13px;margin-top:6px}
.gym .ab b{display:inline-block;min-width:16px}
ul.tight{margin:6px 0 0;padding-left:18px}
ul.tight li{margin:3px 0;font-size:14px}
.goalnum{font-size:30px;font-weight:700;letter-spacing:-.02em}
.foot{font-size:12px;color:var(--text-3);text-align:center;margin-top:20px}

  const s = atob(b.split("").reverse().join(""));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i) ^ k.charCodeAt(i % k.length);
  return JSON.parse(new TextDecoder().decode(out));
}

const isFjm45 = r => r.fjm && r.km < 60;

function cmpLabel(y){

    if (any) REFS[y] = m;

} else if (S && S.ref2022) {

}
const CMP_YEARS = Object.keys(REFS).map(Number).sort((a,b) => b-a);

try { const c = +localStorage.getItem("fjm27-cmp"); if (CMP_YEARS.includes(c)) cmpYear = c; } catch(e){}

/* ---------- pull to refresh: home-screen app has no browser reload ---------- */
(function pullToRefresh(){
  const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  if (!standalone && !/[?&]ptr\b/.test(location.search)) return;
  const el = document.createElement("div");
  el.className = "ptr"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>';
  document.body.appendChild(el);
  const svg = el.firstChild, TRIGGER = 70, MAX = 110;
  let y0 = null, x0 = 0, dy = 0, busy = false;
  const draw = () => {
    const d = Math.min(MAX, dy);
    el.style.transform = `translateY(${d - 48}px)`;
    el.style.opacity = String(Math.min(1, d / 40));
    svg.style.transform = `rotate(${d * 3}deg)`;
    el.classList.toggle("ready", dy >= TRIGGER);
  };
  const reset = () => { el.classList.add("back"); dy = 0; draw(); el.classList.remove("ready"); setTimeout(() => el.classList.remove("back"), 220); };
  addEventListener("touchstart", e => {
    if (busy || e.touches.length !== 1 || scrollY > 0 || document.querySelector("dialog[open]")) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0;
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 === null) return;
    const t = e.touches[0], ry = t.clientY - y0, rx = Math.abs(t.clientX - x0);
    if (dy === 0 && (ry <= 0 || rx > ry)) { y0 = null; return; }  /* scrolling up or sideways: not a pull */
    if (scrollY > 0) { y0 = null; reset(); return; }
    dy = ry * 0.55; draw();
  }, { passive: true });
  const end = () => {
    if (y0 === null) return;
    y0 = null;
    if (dy >= TRIGGER) {
      busy = true; el.classList.add("back", "spin");
      el.style.transform = "translateY(12px)"; el.style.opacity = "1"; svg.style.transform = "";
      setTimeout(() => location.reload(), 250);
    } else reset();
  };
  addEventListener("touchend", end, { passive: true });
  addEventListener("touchcancel", () => { y0 = null; reset(); }, { passive: true });
})();

// ---- running load gauge: last 7 days vs 4-week average ----
function loadCard(){ return `<section class="card" id="loadcard"></section>`; }
function renderLoad(){
  const el = document.getElementById("loadcard"); if (!el) return;
  const runs = (S && S.acts ? S.acts : []).filter(a => /Run/.test(a.s));
  const iso7 = isoD(new Date(today.getTime() - 6*DAY)), iso28 = isoD(new Date(today.getTime() - 27*DAY)), isoT = isoD(today);
  const sum = from => runs.filter(a => a.d >= from && a.d <= isoT).reduce((t,a) => t + num(a.km), 0);
  const acute = sum(iso7), chronic = sum(iso28) / 4;
  if (!chronic) { el.innerHTML = `<h2>Running load</h2><p class="small muted">Not enough recent runs to compare yet.</p>`; return; }
  const r = acute / chronic, MAX = 2;
  const wk = runs.filter(a => a.d >= iso7 && a.d <= isoT).sort((a,b) => num(b.km) - num(a.km))[0];
  const big = wk ? (() => { const d = parseD(wk.d), out = new Date(d); out.setDate(out.getDate() + 7); /* calendar days: DST-safe */ const DN = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]; return {txt:`${DN[(d.getDay()+6)%7]}'s ${num(wk.km).toFixed(1)} km run`, out:`${DN[(out.getDay()+6)%7]} ${fmt(out)}`}; })() : null;
  const onPlan = "Sticking to the plan is fine: it already accounts for this. Just don't add extra runs.";
  const z = r < 0.8 ? {cls:"info", label:"Light", msg:"Below your recent average. Fine for a recovery week, otherwise there's room to build."}
          : r <= 1.3 ? {cls:"good", label:"Steady build", msg:"In the sweet spot: enough to get fitter without overloading."}
          : r <= 1.5 ? {cls:"warning", label:"Pushing", msg:`${big ? `Mostly from ${big.txt}. ` : ""}${onPlan}`}
          : {cls:"serious", label:"Spike: follow the plan, no extras", msg:`${big ? `Mostly from ${big.txt}. ` : ""}${onPlan}${big ? ` It drops back once that run leaves the 7-day window on ${big.out}.` : ""}`};
  const pct = v => Math.min(v, MAX) / MAX * 100;
  const zones = [[0,0.8,"var(--surface-2)"],[0.8,1.3,"color-mix(in srgb,var(--good) 35%,transparent)"],[1.3,1.5,"color-mix(in srgb,var(--warning) 50%,transparent)"],[1.5,MAX,"color-mix(in srgb,var(--serious) 45%,transparent)"]];
  el.innerHTML = `<div class="spread"><h2>Running load</h2><span class="small muted">last 7 days vs 4-week average</span></div>
    <div class="loadtop"><div class="loadv">${r.toFixed(1)}×</div><div><div class="status">${st_icon(z.cls)}${esc(z.label)}</div><div class="small muted">${esc(z.msg)}</div></div></div>

  const restDay = k => /^Rest/i.test((cwk.sessions && cwk.sessions[k]) || "Rest");
  const ranToday = (S && S.acts || []).some(a => /Run/.test(a.s) && a.d === tISO);
  const curDone = !!cwk && KEYS.slice(todayDow + 1).every(restDay) && (restDay(KEYS[todayDow]) || ranToday);
  const pool = synced.filter(a => !curMon || a.wk < curMon || (curDone && a.wk === curMon));
  const evalW = pool.filter(a => planFor(a.wk)).slice(-2);
  const runAct = evalW.reduce((s,a) => s + num(a.runKm), 0), runPlan = evalW.reduce((s,a) => s + mid(planFor(a.wk)), 0);
  const hAct = evalW.reduce((s,a) => s + totH(a), 0), hLo = evalW.reduce((s,a) => s + RNG(planFor(a.wk),"hours").lo, 0);
  const runPct = runPlan ? Math.round(runAct / runPlan * 100) : null;
  const lastDone = evalW[evalW.length-1];
  const prevLong = pool.filter(a => !lastDone || a.wk < lastDone.wk).reduce((m,a) => Math.max(m, num(a.longKm)), 0);
  const longJump = lastDone && prevLong ? num(lastDone.longKm) - prevLong : 0; // ~2.5 km ≈ 15' easy
  let st;
  if (!S || !S.weeks) st = {cls:"info", label:"No data yet", sub:"Waiting for a Strava sync"};

  else {

    const kmTxt = `${runAct.toFixed(0)} km run vs ~${runPlan.toFixed(0)} km planned (${runPct}%)`;
    const lrAct = (S.acts || []).filter(a => /Run/.test(a.s) && a.d >= lastDone.wk && num(a.km) === num(lastDone.longKm))[0];
    if (runPct > 120) st = {cls:"warning", label:"Running above plan", sub:`${span}: ${kmTxt}. Hold back ${lastDone.wk === curMon ? "next" : "this"} week: injuries come from sudden jumps.`};
    else if (longJump > 2.5) st = {cls:"warning", label:"Big step up in long run", sub:`${num(lastDone.longKm).toFixed(1)} km${lrAct ? " on " + fmt(parseD(lrAct.d)) : ""}, up from ${prevLong.toFixed(1)} km before. Keep ${lastDone.wk === curMon ? "next" : "this"} week's long run shorter and easy.`};
    else if (runPct >= 80) st = {cls:"good", label:"On track", sub:`${span}: ${kmTxt} · ${fH(hAct/evalW.length)} h/wk total`};
    else if (hAct >= hLo) st = {cls:"warning", label:"Aerobic on track, run volume low", sub:`${span}: ${kmTxt}. Hours OK via ski/bike — keep Fri hills + the long run as runs`};
    else st = {cls:"serious", label:"Behind", sub:`${span}: ${kmTxt}, hours below range — protect Fri hills + the long run`};
  }

  const cw = W[curIdx], ca = actualBy[cw.wk];
  const longest = done.reduce((m,a) => Math.max(m, num(a.longKm)), 0);
  const tot = done.reduce((s,a) => s + num(a.runKm), 0);
  const withPlan = done.filter(a => planFor(a.wk));
  const vNow = totV(ca), hNow = totH(ca);
  const hParts = ca ? TYPES.filter(t => t.h(ca) > 0) : [];
  const from28 = new Date(today.getTime() - 27*DAY), iso28 = isoD(from28);
  const r28 = (S && S.acts ? S.acts : []).filter(a => /Run/.test(a.s) && a.d >= iso28);
  const r28km = r28.reduce((t,a) => t + num(a.km), 0);
  const lr = r28.reduce((m,a) => (!m || num(a.km) > num(m.km)) ? a : m, null);
  const tile = (l, v, sub) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="sub">${sub}</div></div>`;
  el.innerHTML = [
    `<div class="tile wide"><div class="l">Status</div><div class="v"><span class="status">${st.cls === "info" ? "" : ICON[st.cls]}${esc(st.label)}</span></div><div class="sub">${esc(st.sub)}</div></div>`,
    tile("Run this week", ca ? `${num(ca.runKm).toFixed(1)} km` : "0 km", rngTxt(cw,"km"," km")),
    tile("Vert this week", `+${fM(vNow)} m`, rngTxt(cw,"vert"," m") + (ca && num(ca.bcElev) ? ` · incl. ${fM(ca.bcElev)} m skinning` : "")),
    `<div class="tile"><div class="l">Hours this week</div><div class="v">${fH(hNow)}</div><div class="sub">${rngTxt(cw,"hours"," h")}${hParts.length ? `<div class="hbreak">${hParts.map(t => `<span><i class="sw" style="background:${t.c}"></i>${t.label} ${fH(t.h(ca))}</span>`).join("")}</div>` : ""}</div></div>`,
    tile("Last 4 weeks", r28.length ? `${r28km.toFixed(0)} km` : (done.length ? `${tot.toFixed(0)} km` : "—"), r28.length ? `Rolling 28 days · ${r28.length} runs` : "Before plan start"),
    `<div class="tile"><div class="l">Days to race</div><div class="v" id="count"></div><div class="sub">Sat ${esc(fmtY(parseD(P.race.date)))} · ${esc(P.race.start)}</div></div>`,
    cmpYear ? tile(`${cmpYear} at this point`, (() => { const r = refAt(raceWeekIdx - curIdx); return r ? `${num(r.runKm).toFixed(0)} km` : "—"; })(), (() => { const r = refAt(raceWeekIdx - curIdx); return r ? `+${fM(num(r.runElev))} m · ${fH(totH(r))} h · same weeks-to-race` : "Same weeks-to-race"; })()) : ""

  tickCount();
}

/* ---------- course ---------- */
const C = D.course && D.course.profile && D.course.sections ? D.course : null;
const KIND = {climb:"Climb", descent:"Descent", rolling:"Rolling"};
const GRADE_ORDER = ["<-15%","-15..-8","-8..-3","-3..3","3..8","8..15",">15%"];
const GRADE_COL = ["var(--dv-d3)","var(--dv-d2)","var(--dv-d1)","var(--dv-0)","var(--dv-u1)","var(--dv-u2)","var(--dv-u3)"];
const fClock = s => { const m = Math.round(s/60); return Math.floor(m/60) + ":" + String(m%60).padStart(2,"0"); };
const secAt = km => C.sections.find(s => km >= s.fromKm && km <= s.toKm) || C.sections[C.sections.length-1];
const clockAt = km => { const i = C.sections.indexOf(secAt(km)), s = C.sections[i], t0 = i ? C.sections[i-1].clockAt : 0;
  return t0 + (s.clockAt - t0) * Math.max(0, Math.min(1, (km - s.fromKm) / ((s.toKm - s.fromKm) || 1))); };
const eleAt = km => { const P2 = C.profile; let j = P2.findIndex(p => p[0] >= km); if (j <= 0) return P2[Math.max(0,j)][1]; if (j < 0) return P2[P2.length-1][1];
  const [k0,e0] = P2[j-1], [k1,e1] = P2[j]; return e0 + (e1 - e0) * (km - k0) / ((k1 - k0) || 1); };

    <div class="gbar" role="img" aria-label="Distance by gradient">${GRADE_ORDER.map((k,i) => C.grades[k] ? `<span style="flex:${C.grades[k]};background:${GRADE_COL[i]}" title="${esc(k.replace("..","–").replace(/%?$/,"%"))} grade: ${C.grades[k]} km"></span>` : "").join("")}</div>
    <div class="ggroups">${(() => { const g = k => C.grades[k] || 0, f = v => v.toFixed(1);

function aidLine(km){

}
function renderCourse(){
  const host = document.getElementById("cchart"); if (!host || !C) return;
  const Wd = Math.max(300, host.clientWidth), CH = Wd < 500 ? 200 : 240, m = {l:38, r:8, t:22, b:24};
  const iw = Wd - m.l - m.r, ih = CH - m.t - m.b;
  const y0 = Math.floor(C.minEle / 100) * 100 - 100, y1 = Math.ceil(C.maxEle / 100) * 100 + 50;
  const x = km => m.l + iw * km / C.km, y = e => m.t + ih * (1 - (e - y0) / (y1 - y0));
  let g = "";
  C.sections.forEach((s,i) => {
    g += `<rect x="${x(s.fromKm)}" y="${m.t}" width="${x(s.toKm) - x(s.fromKm)}" height="${ih}" fill="var(--sec-${s.kind})"/>`;
    g += `<line x1="${x(s.fromKm)}" x2="${x(s.fromKm)}" y1="${m.t}" y2="${m.t+ih+4}" stroke="var(--band-edge)" stroke-width="1"/>`;
    g += `<text x="${(x(s.fromKm)+x(s.toKm))/2}" y="${m.t+12}" text-anchor="middle" style="fill:var(--text-2);font-weight:600">${i+1}</text>`;
  });
  for (let e = Math.ceil(y0/200)*200; e <= y1; e += 200) {
    g += `<line x1="${m.l}" x2="${Wd-m.r}" y1="${y(e)}" y2="${y(e)}" stroke="var(--grid)" stroke-width="1" opacity=".8"/>`;
    g += `<text x="${m.l-6}" y="${y(e)+4}" text-anchor="end">${e}</text>`;
  }
  const kStep = Wd < 500 ? 10 : 5, kLast = Math.floor(C.km / kStep) * kStep;
  for (let k = 0; k <= C.km; k += kStep) g += k === kLast
    ? `<text x="${x(k)}" y="${CH-6}" text-anchor="middle">${k} km</text>`
    : `<text x="${x(k)}" y="${CH-6}" text-anchor="middle">${k}</text>`;
  const line = C.profile.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  g += `<polygon points="${x(0)},${y(y0)} ${line} ${x(C.km)},${y(y0)}" fill="var(--series-1)" opacity=".18"/>`;
  g += `<polyline points="${line}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>`;
  const hx = x(C.maxKm), hy = y(C.maxEle);
  g += `<circle cx="${hx}" cy="${hy}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`;
  g += `<text x="${hx + 8}" y="${hy + 14}" style="fill:var(--text);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round">${fM(C.maxEle)} m · km ${C.maxKm}</text>`;
  (C.aid || []).forEach(a => { const ax = x(a.km), ay = y(a.ele);
    g += `<line x1="${ax}" x2="${ax}" y1="${ay}" y2="${m.t+ih}" stroke="var(--text)" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>`;
    g += `<rect x="${ax-5}" y="${ay-5}" width="10" height="10" rx="2" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/>`;
    g += `<text x="${ax}" y="${ay-10}" text-anchor="middle" style="fill:var(--text);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round">${a.label}</text>`; });
  g += `<line id="cx" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-2)" stroke-width="1" visibility="hidden"/><circle id="cdot" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  g += `<rect id="chit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${Wd} ${CH}" width="${Wd}" height="${CH}" role="img" aria-label="Course elevation profile">${g}</svg><div class="tip" id="ctip"></div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector("#ctip"), cx = host.querySelector("#cx"), cd = host.querySelector("#cdot");
  const show = ev => {
    const r = svg.getBoundingClientRect(), sx = r.width ? (ev.clientX - r.left) * Wd / r.width : 0;
    const km = Math.max(0, Math.min(C.km, (sx - m.l) / iw * C.km)), e = eleAt(km), s = secAt(km), i = C.sections.indexOf(s);
    tip.innerHTML = `<b>km ${km.toFixed(1)} · ${fM(e)} m</b><div class="faint">${i+1}. ${esc(s.name)}</div><div class="r"><span class="k">Target clock</span><span><b>${fClock(clockAt(km))}</b></span></div>${aidLine(km)}`;
    tip.style.display = "block"; const px = x(km), tw = tip.offsetWidth; let left = px + 12; if (left + tw > host.clientWidth) left = px - tw - 12;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = "6px";
    cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.setAttribute("visibility", "visible");
    cd.setAttribute("cx", px); cd.setAttribute("cy", y(e)); cd.setAttribute("visibility", "visible");
  };
  const hit = host.querySelector("#chit");
  hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
  hit.addEventListener("click", e => e.stopPropagation());
  svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { tip.style.display = "none"; cx.setAttribute("visibility","hidden"); cd.setAttribute("visibility","hidden"); } });
  document.addEventListener("click", () => { tip.style.display = "none"; cx.setAttribute("visibility","hidden"); cd.setAttribute("visibility","hidden"); });
}

      return `<tr class="${f ? "fjm" : ""}"><td class="num">${t.y}${t.y === YTD_YEAR ? ' <span class="faint">YTD</span>' : ""}${f ? `<span class="tag ${recordRace && f.date === recordRace.date ? "now" : ""}">FJM ${esc(shortT(f.moving))}</span>` : ""}</td><td class="num">${fM(t.runKm)}</td><td class="num">${fM(t.runElev)}</td><td class="num">${fM(t.runH)}</td><td class="num">${fM(t.bcH + t.xcH)}</td><td class="num">${fM(t.rideH + t.zwiftH)}</td><td class="num"><b>${fM(totH(t))}</b></td><td class="num">${t.longKm.toFixed(1)}</td><td class="num">${fM(t.runs)}</td></tr>`; }).join("")}</tbody></table></div>
  </section>`;
}

function renderHistChart(){
  const host = document.getElementById("hchart"); if (!host) return;
  const M = METRICS[hmetric], defs = M.parts({});
  document.getElementById("hlegend").innerHTML = defs.map(p => `<span><i class="sw" style="background:${p.c}"></i>${esc(p.label)}</span>`).join("");
  const Wd = Math.max(300, host.clientWidth), H2 = 200, m = {l: hmetric === "km" ? 38 : 42, r:8, t:14, b:24};
  const iw = Wd - m.l - m.r, ih = H2 - m.t - m.b, N = YEARS.length, bw = iw / N;
  const tot = t => M.parts(t).reduce((s,p) => s + p.v, 0);
  const mx = Math.max(1, ...YEARS.map(tot));
  const step = (() => { const raw = mx / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1,2,2.5,5,10].map(f => f*p).find(s => s >= raw); })();
  const YMAX = Math.ceil(mx / step) * step;
  const y = v => m.t + ih * (1 - v / YMAX), x = i => m.l + bw * (i + .5);
  let g = "";
  for (let v = 0; v <= YMAX + 1e-9; v += step) {
    g += `<line x1="${m.l}" x2="${Wd-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`;
    g += `<text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v >= 1000 ? (v/1000) + "k" : v}</text>`;
  }
  const barW = Math.max(4, Math.min(16, bw * .32)), GAP = 2;
  YEARS.forEach((t,i) => {
    const parts = M.parts(t).filter(p => p.v > 0), x0 = x(i) - barW/2; let base = 0;
    parts.forEach((p, pi) => {
      const yb = y(base) - (pi ? GAP/2 : 0), yt = y(base + p.v) + (pi < parts.length-1 ? GAP/2 : 0); base += p.v; if (yb - yt < .5) return;
      const r = pi === parts.length-1 ? Math.min(barW/2, yb - yt) : 0;
      g += r ? `<path d="M${x0},${yb} V${yt+r} Q${x0},${yt} ${x0+r},${yt} H${x0+barW-r} Q${x0+barW},${yt} ${x0+barW},${yt+r} V${yb} Z" fill="${p.c}"/>` : `<rect x="${x0}" y="${yt}" width="${barW}" height="${yb-yt}" fill="${p.c}"/>`;
    });
    if (t.y === YTD_YEAR) g += `<rect x="${x0}" y="${m.t}" width="${barW}" height="${ih}" fill="none" stroke="var(--band-edge)" stroke-dasharray="3 3"/>`;
    g += `<text x="${x(i)}" y="${H2-6}" text-anchor="middle">${Wd < 500 ? "’" + String(t.y).slice(2) : t.y}</text>`;
    g += `<rect class="hhit" data-i="${i}" x="${m.l + bw*i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${Wd} ${H2}" width="${Wd}" height="${H2}" role="img" aria-label="Yearly ${esc(M.label)}">${g}</svg><div class="tip" id="htip"></div>`;
  const tip = host.querySelector("#htip");
  host.querySelectorAll(".hhit").forEach(rc => { const show = e => { e.stopPropagation(); const t = YEARS[+rc.dataset.i], ps = M.parts(t);
    const f = RACES.find(r => isFjm45(r) && r.date.slice(0,4) === String(t.y));
    tip.innerHTML = `<b>${t.y}${t.y === YTD_YEAR ? " (YTD)" : ""}</b>` + ps.map(p => `<div class="r"><span class="k"><i class="sw" style="background:${p.c}"></i>${esc(p.label)}</span><span>${M.fmt(p.v)}</span></div>`).join("")
      + (ps.length > 1 ? `<div class="r"><span class="k">Total</span><span><b>${M.fmt(tot(t))}</b></span></div>` : "")
      + (f ? `<div class="faint" style="margin-top:4px">FJM 45k ${esc(f.moving)}</div>` : "");
    tip.style.display = "block"; const cx = x(+rc.dataset.i), tw = tip.offsetWidth; let left = cx + 12; if (left + tw > host.clientWidth) left = cx - tw - 12; tip.style.left = Math.max(0,left) + "px"; tip.style.top = "6px"; };
    rc.addEventListener("pointerenter", show); rc.addEventListener("click", show); });
  host.querySelector("svg").addEventListener("pointerleave", e => { if (e.pointerType === "mouse") tip.style.display = "none"; });
  document.addEventListener("click", () => { tip.style.display = "none"; });
}

// ---- motion: animated <details>, sliding toggle indicator, chart transitions ----
(function(){
  const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EASE = "cubic-bezier(.2,.8,.2,1)";
  document.addEventListener("click", ev => {
    const sum = ev.target.closest("summary"); if (!sum) return;
    const det = sum.parentElement; if (!(det instanceof HTMLDetailsElement) || reduce()) return;
    if (det._anim) { const a0 = det._anim; det._anim = null; a0.cancel(); det.style.overflow = ""; }
    ev.preventDefault();
    const startH = det.offsetHeight;
    if (!det.open) {
      det.open = true;
      setTimeout(() => {           // let toggle handlers (charts) render before measuring
        const endH = det.offsetHeight;
        det.style.overflow = "hidden";
        const a = det.animate([{height: startH + "px"}, {height: endH + "px"}], {duration: 300, easing: EASE});
        [...det.children].filter(c => c !== sum).forEach(c => c.animate([{opacity: 0, transform: "translateY(-4px)"}, {opacity: 1, transform: "none"}], {duration: 300, easing: EASE}));
        det._anim = a;
        const done = () => { if (det._anim !== a) return; det._anim = null; det.style.overflow = ""; a.cancel(); };
        a.onfinish = done; setTimeout(done, 340);
      }, 0);
    } else {
      const endH = sum.offsetHeight + (parseFloat(getComputedStyle(det).borderTopWidth) || 0) + (parseFloat(getComputedStyle(det).borderBottomWidth) || 0);
      det.style.overflow = "hidden";
      const a = det.animate([{height: startH + "px"}, {height: endH + "px"}], {duration: 240, easing: EASE});
      det._anim = a;
      const done = () => { if (det._anim !== a) return; det._anim = null; det.open = false; det.style.overflow = ""; a.cancel(); };
      a.onfinish = done; setTimeout(done, 280);
    }
  });
  function place(seg, instant){
    const ind = seg.querySelector(".seg-ind"), b = seg.querySelector('button[aria-selected="true"]');
    if (!ind || !b) return;
    if (instant) seg.classList.remove("ready");
    ind.style.width = b.offsetWidth + "px"; ind.style.transform = `translateX(${b.offsetLeft}px)`;
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => seg.classList.add("ready")));
  }
  document.querySelectorAll(".seg3").forEach(seg => {
    const ind = document.createElement("i"); ind.className = "seg-ind"; ind.setAttribute("aria-hidden", "true");
    seg.prepend(ind); seg.classList.add("has-ind"); place(seg, true);
    new MutationObserver(() => place(seg)).observe(seg, {subtree: true, attributes: true, attributeFilter: ["aria-selected"]});
    seg.closest("details")?.addEventListener("toggle", () => place(seg, true));
  });
  window.addEventListener("resize", () => document.querySelectorAll(".seg3").forEach(seg => place(seg, true)));
  // grow bars when switching metric (not on hover re-renders)
  const pulse = id => { const h = document.getElementById(id); if (!h || reduce()) return; h.classList.add("anim"); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove("anim"), 700); };
  document.querySelectorAll("#chartcard .seg3 button").forEach(b => b.addEventListener("click", () => pulse("chart"), true));
  document.querySelectorAll("#histcard .seg3 button").forEach(b => b.addEventListener("click", () => pulse("hchart"), true));
  const cs = document.getElementById("cmpsel"); if (cs) cs.addEventListener("change", () => pulse("chart"), true);
})();
// phase bar hover/tap: dates per phase
(function(){
  const bar = document.querySelector(".phasebar"), tip = document.getElementById("phtip");
  if (!bar || !tip) return;
  const segs = bar.querySelectorAll(".seg");
  let pinned = null;
  function show(i, el){
    const p = P.phases[i], from = parseD(p.from), to = parseD(p.to);
    const ws = W.filter(x => x.phase === p.name), n0 = ws[0] ? ws[0].n : 0, n1 = ws.length ? ws[ws.length-1].n : 0;
    const days = Math.round((from - today) / DAY), daysEnd = Math.round((to - today) / DAY);
    const when = daysEnd < 0 ? "Done" : days <= 0 ? "Now · " + Math.ceil((daysEnd + 1) / 7) + " wk left" : days < 14 ? "Starts in " + days + " days" : "Starts in " + Math.round(days / 7) + " weeks";
    tip.innerHTML = `<b>${esc(p.name)}</b><div class="r"><span class="k">Dates</span><span>${esc(fmt(from))} – ${esc(fmtY(to))}</span></div>`
      + `<div class="r"><span class="k">Weeks</span><span>${n0}–${n1} (${ws.length})</span></div>`
      + `<div class="r"><span class="k">Running</span><span>${esc(p.km)}</span></div>`
      + `<div class="r"><span class="k">Status</span><span>${esc(when)}</span></div>`
      + `<div class="small muted" style="margin-top:4px">${esc(p.about)}</div>`;
    segs.forEach((s, j) => s.classList.toggle("on", j === i));
    bar.classList.add("hov");
    tip.style.display = "block";
    const bw = bar.clientWidth, tw = tip.offsetWidth, r = el.getBoundingClientRect(), br = bar.getBoundingClientRect();
    const cx = r.left - br.left + r.width / 2;
    tip.style.left = Math.max(0, Math.min(bw - tw, cx - tw / 2)) + "px";
    tip.style.top = (bar.offsetHeight + 6) + "px";
  }
  function hide(){ if (pinned !== null) return; tip.style.display = "none"; bar.classList.remove("hov"); }
  bar.querySelectorAll(".phhit").forEach(h => {
    const i = +h.dataset.ph;
    h.addEventListener("mouseenter", () => { if (pinned === null) show(i, h); });
    h.addEventListener("mouseleave", hide);
    h.addEventListener("focus", () => show(i, h));
    h.addEventListener("blur", () => { pinned = null; hide(); });
    h.addEventListener("click", e => { e.stopPropagation(); if (pinned === i) { pinned = null; hide(); } else { pinned = i; show(i, h); } });
  });
  document.addEventListener("click", () => { if (pinned !== null) { pinned = null; hide(); } });
})();

(function stickyBrand(){
  const wrap = document.querySelector(".sbrand"), sb = wrap.querySelector(".sb"), rk = sb.querySelector(".rk"), bg = wrap.querySelector(".sbg");
  const orig = document.querySelector(".hleft h1.brand"), safeEl = document.querySelector(".sbsafe");
  const mq = matchMedia("(max-width:860px)");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const S1 = 1, RANGE = 70;
  let top0 = 0, rkW = 0, pin = 0, bh = 0, ticking = false;
  const measure = () => {
    if (!mq.matches) { document.body.classList.remove("sb-on"); return; }
    rk.style.maxWidth = ""; sb.style.transform = "";
    const r = orig.getBoundingClientRect();
    top0 = r.top + scrollY;
    sb.style.left = r.left + "px"; sb.style.top = top0 + "px";
    rkW = rk.scrollWidth;
    const safe = safeEl.getBoundingClientRect().height;
    pin = safe + 12;
    bh = r.height;
    document.body.classList.add("sb-on");
    update();
  };
  const update = () => {
    ticking = false;
    if (!mq.matches) return;
    const y = Math.max(0, scrollY);
    const p = reduce.matches ? (y > 20 ? 1 : 0) : Math.min(1, y / RANGE);
    const ty = -Math.min(y, top0 - pin);
    const sc = 1 - (1 - S1) * p;
    sb.style.transform = `translateY(${ty}px) scale(${sc})`;
    const q = reduce.matches ? p : Math.min(1, y / 45);
    rk.style.maxWidth = (rkW * (1 - q)) + "px";
    rk.style.opacity = String(1 - q);
    const pinAt = top0 - pin;
    bg.style.height = (pin + bh * sc + 10) + "px";
    bg.style.opacity = String(Math.min(1, Math.max(0, (y - pinAt + 4) / 6)));
  };
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  addEventListener("resize", measure);
  mq.addEventListener("change", measure);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(measure);
  measure();
})();
})();
