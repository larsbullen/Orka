<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Orka">
<title>Orka</title>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#f4f4f2; --surface-2:#eaeae7; --line:#e2e2df;
  --text:#111111; --text-2:#5c5c59; --text-3:#6b6b67;
  --accent:#ff5b1f; --accent-text:#c2410c; --accent-soft:#ffe6da;
  --ph-1:#d4d4d0; --ph-2:#b0b0ab; --ph-3:#8a8a85; --ph-4:#5f5f5b; --ph-5:#2f2f2d;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a;
  --radius:20px; --inner:#f4f4f2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0c0c; --surface:#171717; --surface-2:#222221; --line:#2c2c2b;
    --text:#f5f5f4; --text-2:#a8a8a4; --text-3:#9a9a96;
    --accent:#ff6a2b; --accent-text:#ff8a57; --accent-soft:#3a2016;
    --ph-1:#3a3a38; --ph-2:#555553; --ph-3:#777774; --ph-4:#9b9b97; --ph-5:#cfcfcb; --inner:#272726;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0c0c0c; --surface:#171717; --surface-2:#222221; --line:#2c2c2b;
    --text:#f5f5f4; --text-2:#a8a8a4; --text-3:#9a9a96;
    --accent:#ff6a2b; --accent-text:#ff8a57; --accent-soft:#3a2016;
    --ph-1:#3a3a38; --ph-2:#555553; --ph-3:#777774; --ph-4:#9b9b97; --ph-5:#cfcfcb; --inner:#272726;
}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("../fonts/inter-latin-wght-normal.woff2") format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",system-ui,-apple-system,sans-serif;background:var(--surface);color:var(--text);line-height:1.5;font-size:15px}
#app{max-width:780px;margin:0 auto;padding:0 16px 48px}
a{color:var(--accent-text)}
.hero{padding:32px 4px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-size:48px;font-weight:900;letter-spacing:-.045em;line-height:.95;margin-bottom:8px}
@media (max-width:560px){.brand{font-size:40px}}
.sub1{color:var(--text-2);font-size:16px}
.card{background:var(--bg);border-radius:var(--radius);padding:22px 20px;margin-bottom:14px}
.card h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.card h3{font-size:15px;font-weight:700;margin:14px 0 4px}
.card p{margin:6px 0}
.kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text);margin-bottom:6px}
.muted{color:var(--text-2)}
.small{font-size:13px}
ul.clean{list-style:none}
ul.dots{padding-left:18px}
ul.dots li{margin:4px 0}
.welcome .big{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:2px 0 8px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.pill.on{background:var(--accent-soft);color:var(--accent-text)}
/* stage bar */
.stages{display:flex;gap:4px;margin:14px 0 6px}
.stages i{flex:1;height:8px;border-radius:4px;background:var(--surface-2)}
.stages i.on{background:var(--accent)}
.stlabels{display:flex;gap:4px;font-size:11px;color:var(--text-2)}
.stlabels span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* intake */
.q{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .n{flex:none;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--text-2)}
.q.done .n{background:var(--good);color:#fff}
.q b{display:block;font-weight:650}
.q .why{font-size:13px;color:var(--text-2);margin-top:2px}
.q .ans{font-size:14px;margin-top:6px;padding:8px 10px;background:var(--surface);border-radius:8px}
/* three ways */
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (max-width:560px){.ways{grid-template-columns:1fr}}
.ways div{background:var(--surface);border-radius:12px;padding:12px}
.ways b{display:block;margin-bottom:2px}
.ways span{font-size:13px;color:var(--text-2)}
/* details panels */
details.x{border-top:1px solid var(--line)}
details.x:first-of-type{border-top:0}
details.x>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 0}
details.x>summary::-webkit-details-marker{display:none}
details.x>summary .t{flex:1;min-width:0}
details.x>summary .t b{display:block;font-weight:700}
details.x>summary .t small{font-size:13px;color:var(--text-2)}
details.x>summary .chv{color:var(--text-2);transition:transform .15s;font-size:18px}
details.x[open]>summary .chv{transform:rotate(90deg)}
details.x>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.xbody{padding:0 0 16px 0}
.dot{flex:none;width:12px;height:12px;border-radius:999px;background:var(--surface-2)}
.dot.on{background:var(--accent)}
.gate{margin-top:8px;font-size:14px;padding:8px 10px;background:var(--surface);border-radius:8px}
/* lessons */
.lesson .parts{display:grid;gap:10px;margin-top:10px}
.lesson .part{padding:10px 12px;background:var(--surface);border-radius:10px}
.lesson .part .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin-bottom:2px}
.lesson .take{margin-top:12px;font-weight:650;font-size:16px}
.lesson .reflect{margin-top:10px;font-size:14px;color:var(--text-2);font-style:italic}
.more{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.more .mh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text)}
.more h4{font-size:14px;font-weight:700;margin:12px 0 2px}
.more .mb p{line-height:1.6}
.more .mb{margin-top:4px;font-size:14px}
.more .mb p{margin:8px 0}
.cite{font-size:12px;color:var(--text-2);margin-top:8px}
.note{font-size:12px;color:var(--text-2);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.adapt{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--text-2);vertical-align:1px;margin-left:4px}
.stop{border-left:4px solid var(--serious)}
.pep{margin-top:12px !important;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.lg{font-size:12px !important;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin:18px 0 0 !important}
/* library items look like the day cards on Olle's page */
details.x.libitem{background:var(--inner);border:0;border-radius:14px;margin-top:6px}
details.x.libitem>summary{padding:12px 14px}
details.x.libitem .xbody{padding:0 14px 16px}
details.x.libitem .part{background:var(--bg)}
.foot{font-size:12px;color:var(--text-2);text-align:center;margin-top:24px}
.hright{flex:none}
/* ---------- profile switcher ---------- */
.pmenu{position:relative}
.pbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:2px;border-radius:999px}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.av{position:relative;overflow:hidden;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--text);color:var(--bg);flex:none}
.pbtn .chev{color:var(--text-2);transition:transform .15s}
.pbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pdrop{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;max-width:calc(100vw - 32px);background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;z-index:60}
.pdrop[hidden]{display:none}
.pdrop .ph{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);padding:8px 10px 4px}
.pdrop a,.pdrop button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--text)}
.pdrop a:hover,.pdrop button:hover,.pdrop a:focus-visible,.pdrop button:focus-visible{background:var(--surface-2)}
.pdrop .av{width:28px;height:28px;font-size:12px}
.pdrop .pinfo{display:flex;flex-direction:column;min-width:0;flex:1}
.pdrop .pinfo small{font-size:12px;color:var(--text-2)}
.pdrop .tick{margin-left:auto;color:var(--accent-text,var(--accent));font-weight:700}
.pdrop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pdrop .ticon{width:28px;text-align:center;font-size:16px;color:var(--text-2)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#f5f2ea}
.pbtn .av{width:36px;height:36px;box-shadow:0 0 0 1px var(--line)}

/* mobile header: match Olle's page (safe-area, edge alignment, sticky "O." on scroll) */
.hero{padding:calc(32px + env(safe-area-inset-top)) 0 18px}
@media (max-width:860px){.hero{padding-top:calc(28px + env(safe-area-inset-top))}}
#app{padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
.brand{margin-bottom:2px}
.sbrand{display:none}
@media (max-width:860px){
  .sbrand{display:block;position:fixed;top:0;left:0;right:0;z-index:50;pointer-events:none}
  .sbrand .sb{position:absolute;margin:0;transform-origin:0 0;will-change:transform}
  .sbrand .sb .rk{display:inline-block;overflow:hidden;vertical-align:top;white-space:nowrap}
  body.sb-on .hero h1.brand{visibility:hidden}
}
.sbrand .sb{font-size:40px;font-weight:900;letter-spacing:-.045em;line-height:.95;color:var(--text)}
.sbsafe{position:fixed;top:0;height:env(safe-area-inset-top);width:0;visibility:hidden;pointer-events:none}
</style>
</head>

  document.addEventListener("keydown", e => {
    if (drop.hidden) return;
    if (e.key === "Escape") { set(false); btn.focus(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const it = items(), i = it.indexOf(document.activeElement); it[(i + (e.key === "ArrowDown" ? 1 : it.length - 1)) % it.length].focus(); }
  });
})();
function syncThemeColor(){
  const c = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim();
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { if (document.documentElement.dataset.theme) { m.setAttribute("content", c); m.removeAttribute("media"); } });
}
syncThemeColor();
}


const si = Math.max(0, P.roadmap.findIndex(s => s.current));

function hero(){
  return `<header class="hero">
    <div><h1 class="brand">Orka.</h1><div class="sub1">${esc(P.subtitle)}</div></div>
    <div class="hright">${profileMenu()}</div>
  </header>`;
}

function welcome(){
  const st = P.roadmap;
  return `<section class="card welcome">
    <div class="kicker">${esc(P.welcome.kicker)}</div>
    <div class="big">${md(P.welcome.title)}</div>
    ${P.welcome.text.map(t => `<p>${md(t)}</p>`).join("")}
    ${P.pep && P.pep.length ? `<p class="pep">${md(P.pep[Math.floor(Date.now() / 864e5) % P.pep.length])}</p>` : ""}
    <div class="stages" aria-hidden="true">${st.map((s,i) => `<i class="${i <= si ? "on" : ""}"></i>`).join("")}</div>
    <div class="stlabels" aria-label="Roadmap stage ${si+1} of ${st.length}: ${esc(st[si].name)}">${st.map(s => `<span>${esc(s.short || s.name)}</span>`).join("")}</div>
  </section>`;
}

function now(){
  const n = P.now;
  return `<section class="card">
    <div class="kicker">Right now</div>
    <h2>${esc(n.title)}</h2>
    ${n.text.map(t => `<p>${md(t)}</p>`).join("")}
    ${list(n.items)}
    <h3>${esc(n.flex.title)}</h3>
    <div class="ways">${n.flex.ways.map(w => `<div><b>${esc(w.t)}</b><span>${md(w.d)}</span></div>`).join("")}</div>
    ${n.flex.note ? `<p class="small muted" style="margin-top:10px">${md(n.flex.note)}</p>` : ""}
  </section>`;
}

function intake(){
  const I = P.intake, done = I.items.filter(q => q.answer).length;
  return `<section class="card">
    <div class="kicker">Getting to know you · ${done} of ${I.items.length}</div>
    <h2>${esc(I.title)}</h2>
    <p class="muted">${md(I.text)}</p>
    <div style="margin-top:8px">${I.items.map((q,i) => `<div class="q${q.answer ? " done" : ""}"><span class="n">${q.answer ? "✓" : i+1}</span><div><b>${esc(q.q)}</b><div class="why">${md(q.why)}</div>${q.answer ? `<div class="ans">${md(q.answer)}</div>` : ""}</div></div>`).join("")}</div>
  </section>`;
}

function lessonBody(l){
  return `<div class="parts">
      <div class="part"><div class="l">What you might notice</div>${md(l.notice)}</div>
      <div class="part"><div class="l">What it means</div>${md(l.means)}</div>
      <div class="part"><div class="l">One thing to try</div>${md(l.try)}</div>
    </div>
    <p class="take">${md(l.takeaway)}</p>
    ${l.reflect ? `<p class="reflect">${esc(l.reflect)} <span class="small">(Optional. Just for you.)</span></p>` : ""}
    ${l.more ? `<div class="more"><div class="mh">Learn more</div><div class="mb">${l.more.map(p => p.startsWith("## ") ? `<h4>${md(p.slice(3))}</h4>` : `<p>${md(p)}</p>`).join("")}${l.cite ? `<div class="cite">Sources: ${l.cite.map(md).join(" · ")}</div>` : ""}</div></div>` : ""}`;
}

function lessons(){
  const cur = L.list.find(l => l.id === L.current) || L.list[0];
  if (!cur) return "";
  const rest = L.list.filter(l => l !== cur);
  return `<section class="card lesson">
    <div class="kicker">A short lesson · about a minute</div>
    <h2>${esc(cur.title)}</h2>
    ${lessonBody(cur)}
    <p class="note">${md(L.note)}</p>
  </section>
  <section class="card">
    <div class="kicker">More lessons, whenever you like</div>
    <h2>Lesson library</h2>
    <p class="muted small">${md(L.libraryNote)}</p>
    ${(L.groups || [["", rest.map(l => l.id)]]).map(([g, ids]) => { const ls = ids.map(id => rest.find(l => l.id === id)).filter(Boolean); return ls.length ? `${g ? `<h3 class="lg">${esc(g)}</h3>` : ""}<div>${ls.map(l => `<details class="x lesson libitem"><summary><span class="t"><b>${esc(l.title)}</b>${l.later ? `<small>${esc(l.later)}</small>` : ""}</span><span class="chv" aria-hidden="true">›</span></summary><div class="xbody">${lessonBody(l)}</div></details>`).join("")}</div>` : ""; }).join("")}
  </section>`;
}

function roadmap(){
  return `<section class="card">
    <div class="kicker">The big picture</div>
    <h2>Roadmap to Fjällmaraton 27K</h2>
    <p class="muted">${md(P.roadmapIntro)}</p>
    <div style="margin-top:6px">${P.roadmap.map((s,i) => `<details class="x"${s.current ? " open" : ""}><summary><span class="dot${i <= si ? " on" : ""}"></span><span class="t"><b>${esc(s.name)}${s.current ? ' <span class="pill on">You are here</span>' : ""}</b><small>${esc(s.when)}</small></span><span class="chv" aria-hidden="true">›</span></summary><div class="xbody">${list(s.what)}${s.gate ? `<div class="gate"><b>Moving on when:</b> ${md(s.gate)}</div>` : ""}</div></details>`).join("")}</div>
    <h3>Race-readiness check-ins</h3>
    ${list(P.checkins)}
    <h3>The race</h3>
    ${list(P.race.facts)}
    <p class="small muted">${md(P.race.note)}</p>
  </section>`;
}

function sources(){
  const s = P.sources;
  return `<section class="card">
    <div class="kicker">Where this comes from</div>
    <h2>Sources and Orka's adaptations</h2>
    <h3>Sources used</h3>
    ${list(s.used)}
    <h3>Orka's own adaptations <span class="adapt">Orka</span></h3>
    ${list(s.adaptations)}
    <p class="small muted" style="margin-top:8px">${md(s.disclaimer)}</p>
  </section>`;
}

app.innerHTML = hero() + welcome() + now() + intake() + lessons() + roadmap() + sources() +
  `<p class="foot">Updated ${esc(new Date(D.built).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}))}</p>`;
initProfileMenu();
(function stickyBrand(){
  const wrap = document.querySelector(".sbrand"), sb = wrap.querySelector(".sb"), rk = sb.querySelector(".rk");
  const orig = document.querySelector(".hero h1.brand"), safeEl = document.querySelector(".sbsafe");
  const mq = matchMedia("(max-width:860px)");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  let top0 = 0, rkW = 0, pin = 0, ticking = false;
  const measure = () => {
    if (!mq.matches) { document.body.classList.remove("sb-on"); return; }
    rk.style.maxWidth = ""; sb.style.transform = "";
    const r = orig.getBoundingClientRect();
    top0 = r.top + scrollY;
    sb.style.left = r.left + "px"; sb.style.top = top0 + "px";
    rkW = rk.scrollWidth;
    pin = safeEl.getBoundingClientRect().height + 12;
    document.body.classList.add("sb-on");
    update();
  };
  const update = () => {
    ticking = false;
    if (!mq.matches) return;
    const y = Math.max(0, scrollY);
    sb.style.transform = `translateY(${-Math.min(y, top0 - pin)}px)`;
    const q = reduce.matches ? (y > 20 ? 1 : 0) : Math.min(1, y / 45);
    rk.style.maxWidth = (rkW * (1 - q)) + "px";
    rk.style.opacity = String(1 - q);
  };
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  addEventListener("resize", measure);
  mq.addEventListener("change", measure);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(measure);
  measure();
})();
})();
</script>
